<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Fale com a equipe da Rio Abaixo de Rafting. Envie suas dúvidas, solicite informações sobre passeios e faça sua reserva com facilidade">
    <meta name="author" content="Thiago de Oliveira Lima">
    <title>Contato | Rio Abaixo de Rafting</title>
    <link rel="stylesheet" href="estilos/rafting.css">
</head>

<body>
    <div class="hero">
        <header>
            <img src="imagens/rio_abaixo.png" alt="Rio Abaixo."> <!-- width="200" -->
            <nav>
                <ul>
                    <li><a href="index.html">Página Inicial</a></li>
                    <li><a href="sobre.html">Sobre Nós</a></li>
                    <li><a href="passeios.html">Passeios</a></li>
                    <li><a href="contato.html">Fale Conosco</a></li>
                </ul>
            </nav>
        </header>
    </div>
    <main>
        <div class="contato">
            <h2>Companhia de RAfting em corredeiras</h2>
            <h3 class="h3">123 Rua Principal do Rio</h3>
            <h3 class="h3">São Paulo, SP</h3>
            <h3 class="h3">+55 11 96566-4173</h3>
            <h3 class="h3">contato@rafting.com.br</h3>
        </div>
        <div class="formulario">
            <iframe class="map" src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d14616.040998277025!2d-46.699514150000006!3d-23.675591450000002!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1spt-BR!2sbr!4v1785175913494!5m2!1spt-BR!2sbr" width="600" height="450" allowfullscreen="" loading=" lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            <form class="">

                <div class="campo">
                    <label for="nome">Nome</label>
                    <input type="text" name="nome" placeholder="Digite aqui">
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="Digite aqui">
                </div>

                <div class="campo">

                    <label for="q3">Propósito da Mensagem</label>

                    <div class="radio">
                        <label>
                            <input type="radio" name="assunto" value="duvida">
                            Dúvida Geral
                        </label>

                        <label>
                            <input type="radio" name="assunto" value="reserva">
                            Pergunta sobre Reserva
                        </label>

                        <label>
                            <input type="radio" name="assunto" value="sugestao">
                            Sugestão
                        </label>
                    </div>

                    <div class="campo">
                        <label for="q4">Mensagem</label>
                        <textarea name="q4" id="q4"></textarea>
                    </div>

                    <div class="campo">
                        <label>
                            <input type="checkbox">
                            Por favor, me inscreva na newsletter mensal
                        </label>
                    </div>
                    
                    <div class="botao">
                        <button type="submit">Entrar em Contato!</button>
                    </div>
                </div>
            </form>
        </div>



        <h2>Estamos Aqui para Serví-lo</h2>

        <div class="contato-galeria">

            <figure>
                <img src="imagens/aventura1.jpg" alt="Desça as corredeiras e viva uma aventura inesquecível!">
                <figcaption>Perfil do Funcionário</figcaption>
            </figure>
            <figure>
                <img src="imagens/aventura2.jpg" alt="Cada remoada é um novo desafio rumo à emoção.">
                <figcaption>Perfil do Funcionário</figcaption>
            </figure>
            <figure>
                <img src="imagens/aventura3.jpg" alt="Explore a natureza, sinta a adrenalina e crie memórias únicas.">
                <figcaption>Perfil do Funcionário</figcaption>
        </div>
        </section>
    </main>
    <footer>
        <div>
            <nav class="socialmedia">
                <p>© 2026 | Rio Abaixo de Rafting | Thiago Lima | São Paulo - SP</p>
                <a href="https://facebook.com">
                    <img src="imagens/facebook.png" alt="Ícone do Facebook">
                </a>
                <a href="https://linkedin.com">
                    <img src="imagens/linkedin.png" alt="Ícone do LinkedIn">
                </a>

                <a href="https://instagram.com">
                    <img src="imagens/instagram.png" alt="Ícone do Instagram">
                </a>
            </nav>
        </div>
    </footer>
</body>

</html>
